name: WordPress Plugin Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production tree
        shell: bash
        run: |
          mkdir -p plugin-build/tabora-product-tabs-for-woocommerce
          git archive HEAD | tar -x -C plugin-build/tabora-product-tabs-for-woocommerce

      - name: Lint PHP
        shell: bash
        run: find plugin-build/tabora-product-tabs-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin-build/tabora-product-tabs-for-woocommerce

      - name: Show WordPress debug log on failure
        if: failure()
        shell: bash
        run: |
          wp-env run cli wp config set WP_DEBUG true --raw
          wp-env run cli wp config set WP_DEBUG_LOG true --raw
          wp-env run cli wp config set WP_DEBUG_DISPLAY false --raw
          wp-env run cli sh -lc 'WP_CLI_PHP_ARGS="-d display_errors=1 -d log_errors=1 -d error_log=/tmp/tabora-php-errors.log" wp --debug plugin check tabora-product-tabs-for-woocommerce --format=json --require=./wp-content/plugins/plugin-check/cli.php || true; test ! -f /tmp/tabora-php-errors.log || cat /tmp/tabora-php-errors.log'
          wp-env run cli sh -lc 'test ! -f wp-content/debug.log || tail -n 200 wp-content/debug.log'
