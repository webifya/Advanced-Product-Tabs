name: WordPress Plugin Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production tree
        shell: bash
        run: |
          mkdir -p plugin-build/tabora-product-tabs-for-woocommerce
          git archive HEAD | tar -x -C plugin-build/tabora-product-tabs-for-woocommerce

      - name: Lint PHP
        shell: bash
        run: find plugin-build/tabora-product-tabs-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin-build/tabora-product-tabs-for-woocommerce
