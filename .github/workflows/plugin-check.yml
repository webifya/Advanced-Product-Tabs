name: WordPress Plugin Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production tree
        shell: bash
        run: |
          mkdir -p plugin-build/tabora-product-tabs-for-woocommerce
          git archive HEAD | tar -x -C plugin-build/tabora-product-tabs-for-woocommerce

      - name: Lint PHP
        shell: bash
        run: find plugin-build/tabora-product-tabs-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l

      # Plugin Check 2.0 currently crashes in the action's JSON wrapper even
      # when the same check succeeds directly. Keep the action for its tested
      # WordPress/dependency setup, then use the direct command as the gate.
      - name: Set up Plugin Check environment
        uses: wordpress/plugin-check-action@v1
        continue-on-error: true
        with:
          build-dir: ./plugin-build/tabora-product-tabs-for-woocommerce

      - name: Run Plugin Check
        shell: bash
        run: wp-env run cli sh -lc 'wp --debug plugin check tabora-product-tabs-for-woocommerce --require=./wp-content/plugins/plugin-check/cli.php'
